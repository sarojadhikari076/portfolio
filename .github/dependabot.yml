version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript below 6.1, so 7 waits for it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # eslint-config-next's plugins peer on ESLint 9 at most.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      # Types follow the runtime, which is Node 24 (.node-version, engines).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      next-react:
        patterns: ['next', '@next/*', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
