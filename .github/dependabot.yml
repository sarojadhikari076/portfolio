version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns: ['next', '@next/*', 'eslint-config-next', 'react', 'react-dom', '@types/react*']
      three:
        patterns: ['three', '@types/three', '@react-three/*']
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
