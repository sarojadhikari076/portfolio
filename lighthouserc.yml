# Lighthouse on a simulated mid-range phone, against the production build. Bundle size is measured
# separately and recorded in the colophon; this gates the categories and timings.
#
# Accessibility, best practices and SEO must be perfect. Performance must stay at 0.9 or above on
# every page, the home page included, though its three.js loads only once the page is idle.
ci:
  collect:
    startServerCommand: pnpm exec next start --port 3300
    startServerReadyPattern: Ready
    url:
      - http://localhost:3300/
      - http://localhost:3300/work/mela
      - http://localhost:3300/writing/selling-the-last-ticket
    numberOfRuns: 3
    settings:
      formFactor: mobile
      onlyCategories: [performance, accessibility, best-practices, seo]
  assert:
    assertions:
      categories:performance: [error, { minScore: 0.9 }]
      categories:accessibility: [error, { minScore: 1 }]
      categories:best-practices: [error, { minScore: 1 }]
      categories:seo: [error, { minScore: 1 }]
      cumulative-layout-shift: [error, { maxNumericValue: 0.05 }]
      largest-contentful-paint: [error, { maxNumericValue: 2000 }]
      total-blocking-time: [warn, { maxNumericValue: 200 }]
  upload:
    target: filesystem
    outputDir: ./.lighthouseci
